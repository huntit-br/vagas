name: Configurar Labels do Mural

on:
  push:
    paths:
      - '.github/workflows/setup-labels.yml'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  setup-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Criar ou Atualizar Labels Oficiais
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;

            const desiredLabels = [
              { name: 'vaga', color: '0075CA', description: 'Oportunidade aberta na HUNT IT' },
              { name: 'remoto', color: '0E8A16', description: '100% Trabalho Remoto' },
              { name: 'hibrido', color: 'BFD4F2', description: 'Modelo Híbrido' },
              { name: 'presencial', color: 'D4C5F9', description: 'Atuação Presencial' },
              { name: 'junior', color: '1D76DB', description: 'Nível Júnior' },
              { name: 'pleno', color: 'FBCA04', description: 'Nível Pleno' },
              { name: 'senior', color: 'D93F0B', description: 'Nível Sênior' },
              { name: 'tech-lead', color: '5319E7', description: 'Tech Lead / Liderança Técnica' },
              { name: 'especialista', color: '6F42C1', description: 'Especialista / Staff / Principal' },
              { name: 'backend', color: 'B60205', description: 'Engenharia de Software Backend' },
              { name: 'frontend', color: '006B75', description: 'Engenharia de Software Frontend' },
              { name: 'fullstack', color: 'E99695', description: 'Engenharia de Software Fullstack' },
              { name: 'mobile', color: 'C2E0C6', description: 'Desenvolvimento Mobile (iOS / Android / Flutter)' },
              { name: 'devops', color: '0052CC', description: 'DevOps, SRE & Cloud Engineering' },
              { name: 'dados-ia', color: '5319E7', description: 'Engenharia de Dados, Analytics, BI & IA' },
              { name: 'qa', color: 'FBCA04', description: 'Qualidade de Software, Testes & QA' },
              { name: 'seguranca', color: '333333', description: 'Segurança da Informação / AppSec' },
              { name: 'pj', color: '545D68', description: 'Contratação PJ' },
              { name: 'clt', color: '7057FF', description: 'Contratação CLT' }
            ];

            const defaultUnused = [
              'accessibility', 'bug', 'documentation', 'duplicate', 'enhancement',
              'good first issue', 'help wanted', 'invalid', 'question', 'wontfix'
            ];

            for (const name of defaultUnused) {
              try {
                await github.rest.issues.deleteLabel({ owner, repo, name });
                console.log(`Removida label padrão desnecessária: ${name}`);
              } catch (e) {}
            }

            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner,
              repo,
              per_page: 100
            });

            const existingMap = new Map(existing.map(l => [l.name.toLowerCase(), l]));

            for (const label of desiredLabels) {
              const current = existingMap.get(label.name.toLowerCase());
              if (current) {
                await github.rest.issues.updateLabel({
                  owner,
                  repo,
                  name: current.name,
                  new_name: label.name,
                  color: label.color,
                  description: label.description
                });
              } else {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              }
            }
            console.log('Labels limpas e configuradas com perfeição!');
